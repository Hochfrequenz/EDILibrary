name: Unittests and Coverage

on: [push, pull_request]

jobs:
  unittest:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Setup .NET Core
          uses: actions/setup-dotnet@v6
          with:
            # EDILibraryTests multi-targets net8.0;net10.0 (the two TargetFrameworks the
            # libraries support); both runtimes need to be installed so "dotnet test" can
            # actually execute both, not just build them.
            dotnet-version: |
              8.x
              10.x
        - name: Run Tests
          run: dotnet test --configuration Release
  coverage:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Install dependencies
        run: dotnet restore
      - name: Install coverlet.msbuild in EDILibraryTests
        working-directory: ./EDILibraryTests
        run: dotnet add package coverlet.msbuild
      - name: Measure Test Coverage
        run: dotnet test /p:Threshold=7 /p:Include=\"[*]EDILibrary.*\" /p:ThresholdType=line /p:CollectCoverage=true /p:SkipAutoProps=true /p:CoverletOutputFormat=lcov --configuration Release
